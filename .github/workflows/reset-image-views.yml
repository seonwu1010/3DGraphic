name: Reset image view counts

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESET to confirm"
        required: true
        type: string

jobs:
  reset:
    if: github.event.inputs.confirmation == 'RESET'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
      - name: Reset Firestore counters
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run reset:image-views
